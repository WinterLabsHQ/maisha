name: Release to PyPI

# Publishes maishac to PyPI when a version tag is pushed (e.g. v0.2.1).
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret to manage.
# ONE-TIME SETUP: on pypi.org, add a trusted publisher for project `maishac`
#   owner: WinterLabsHQ · repo: maisha · workflow: release.yml · environment: pypi
# See https://docs.pypi.org/trusted-publishers/
#
# Order: tests -> build + verify (tag must equal v{maishac.__version__}) -> publish.
# Actions are pinned to commit SHAs; the comment names the tag each came from.
# pypa/gh-action-pypi-publish is pinned to the commit of a release tag (v1.x), not
# the moving release/v1 branch. Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,mcp]"
      - run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build
      - run: twine check dist/*
      - name: Tag must equal v{__version__}; wheel must ship the rules
        env:
          MAISHAC_TAG: ${{ github.ref_name }}
        run: python tools/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
