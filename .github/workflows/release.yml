name: Release to PyPI

# Publishes maishac to PyPI when a version tag is pushed (e.g. v0.2.1).
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret to manage.
# ONE-TIME SETUP: on pypi.org, add a trusted publisher for project `maishac`
#   owner: WinterLabsHQ · repo: maisha · workflow: release.yml · environment: pypi
# See https://docs.pypi.org/trusted-publishers/
#
# Order: tests -> build + verify (tag must equal v{maishac.__version__}) -> publish.
# Actions are pinned to commit SHAs; the comment names the tag each came from.
# pypa/gh-action-pypi-publish publishes from its release/v1 branch (its documented
# channel), pinned to the branch head at the time of writing (v1.x).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,mcp]"
      - run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build
      - run: twine check dist/*
      - name: Tag must equal v{__version__}; wheel must ship the rules
        env:
          MAISHAC_TAG: ${{ github.ref_name }}
        run: python tools/check_dist.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
