name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the comment names the
# release tag the SHA was taken from). To update: look up the new tag's commit
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`; dereference annotated tags)
# and change both the SHA and the comment.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows and macOS are experimental: the native analyzer and unit tests are
    # portable, but these runners have not been verified green yet, so a failure
    # there is reported without blocking the merge. Remove continue-on-error
    # once they pass.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - os: windows-latest
            python-version: "3.12"
            experimental: true
          - os: macos-latest
            python-version: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # mcp is an optional extra; install it so the MCP server tests run.
      - run: pip install -e ".[dev,mcp]"
      # external analyzers are optional; the native analyzer always runs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      - run: pytest -q

  test-without-mcp:
    # The CLI (scan/gate/report/sessions) must work without the optional mcp extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q   # MCP tests skip via importorskip

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel ships the rule knowledge base
        run: python tools/check_dist.py dist
