[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maishac"
dynamic = ["version"]
description = "Agent harness for MISRA C, BARR-C and CERT C compliance: persistent memory, engineered fix loops, and an MCP server usable from any agentic IDE."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maisha contributors" }]
keywords = ["misra", "cert-c", "barr-c", "static-analysis", "mcp", "agent", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Embedded Systems",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WinterLabsHQ/maisha"
Repository = "https://github.com/WinterLabsHQ/maisha"
Issues = "https://github.com/WinterLabsHQ/maisha/issues"
Changelog = "https://github.com/WinterLabsHQ/maisha/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The MCP server is optional: scan/gate/report/sessions work without it.
# Capped below 2: mcp 2.x removed `mcp.server.fastmcp`, which mcp_server.py uses.
mcp = ["mcp>=1.2.0,<2"]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4", "pyyaml>=6", "tomli>=2; python_version < '3.11'"]

[project.scripts]
maishac = "maishac.cli:main"

[tool.setuptools.packages.find]
include = ["maishac*"]

[tool.setuptools.package-data]
"maishac.rules" = ["*.json"]

[tool.setuptools.dynamic]
version = { attr = "maishac.__version__" }

[tool.ruff]
target-version = "py310"
extend-exclude = ["benchmark/corpora"]

[tool.ruff.lint]
# Baseline: real bugs only (pyflakes + pycodestyle errors). Style rules are not
# enabled, so adopting ruff did not require reformatting the code base.
select = ["E4", "E7", "E9", "F"]
# Pre-existing dense one-line style in the native analyzer tables and a few tests.
ignore = ["E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
# benchmark/corpora holds gitignored third-party clones; never collect from them.
testpaths = ["tests"]
